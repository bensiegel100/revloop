name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run extension-host tests with Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Run extension-host tests
        if: runner.os != 'Linux'
        run: npm run test:extension
      - name: Package platform VSIX
        run: npm run package:vscode
      - id: vscode-artifact
        run: node scripts/vscode-artifact.mjs github-output
      - uses: actions/upload-artifact@v4
        with:
          name: revloop-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.vscode-artifact.outputs.artifact_path }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: revloop-copilot-plugin
          path: plugin
