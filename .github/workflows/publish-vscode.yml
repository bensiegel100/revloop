name: Publish VS Code Extension

on:
  workflow_dispatch:

concurrency:
  group: publish-vscode
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the current main commit
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

  validate:
    name: Validate (${{ matrix.os }})
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run check
      - name: Run extension-host tests with Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Run extension-host tests
        if: runner.os != 'Linux'
        run: npm run test:extension

  publish:
    name: Package and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_path: ${{ steps.artifact.outputs.artifact_path }}
      checksum_path: ${{ steps.artifact.outputs.checksum_path }}
      tag: ${{ steps.artifact.outputs.tag }}
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - name: Install Copilot CLI
        run: npm_config_ignore_scripts=false npm install --global @github/copilot@1.0.114
      - name: Build plugin runtime dependencies
        run: npm run build --workspace @revloop/shared && npm run build --workspace @revloop/mcp
      - run: npm run test:plugin
      - run: npm run test:fuzz
      - id: artifact
        run: node scripts/vscode-artifact.mjs github-output
      - name: Require an unused release identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Git tag $TAG already exists."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG already exists."
            exit 1
          fi
      - name: Set reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - run: npm run package:vscode
      - run: node scripts/vscode-artifact.mjs checksum
      - uses: actions/upload-artifact@v4
        with:
          name: revloop-vscode-${{ steps.artifact.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.artifact_path }}
            ${{ steps.artifact.outputs.checksum_path }}
      - run: npm run publish:vscode

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: revloop-vscode-${{ needs.publish.outputs.version }}
          path: release-artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release create "$TAG" \
            "release-artifacts/${{ needs.publish.outputs.artifact_path }}" \
            "release-artifacts/${{ needs.publish.outputs.checksum_path }}" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Revloop $VERSION"
