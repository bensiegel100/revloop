name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_path: ${{ steps.artifact.outputs.artifact_path }}
      checksum_path: ${{ steps.artifact.outputs.checksum_path }}
      tag: ${{ steps.artifact.outputs.tag }}
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run test:extension
      - name: Install Copilot CLI
        run: npm_config_ignore_scripts=false npm install --global @github/copilot@1.0.114
      - run: npm run test:plugin
      - run: npm run test:fuzz
      - id: artifact
        run: node scripts/vscode-artifact.mjs github-output
      - name: Verify tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "${{ steps.artifact.outputs.tag }}"
      - run: npm run package:vscode
      - run: node scripts/vscode-artifact.mjs checksum
      - uses: actions/upload-artifact@v4
        with:
          name: revloop-vscode-${{ steps.artifact.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.artifact_path }}
            ${{ steps.artifact.outputs.checksum_path }}
      - run: npm run publish:vscode

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: revloop-vscode-${{ needs.publish.outputs.version }}
          path: release-artifacts
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          files=(
            "release-artifacts/${{ needs.publish.outputs.artifact_path }}"
            "release-artifacts/${{ needs.publish.outputs.checksum_path }}"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Revloop $VERSION"
          fi
